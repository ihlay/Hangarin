{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In Via Google — Hangarin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <style>
    :root {
      --olive-dark: #3d4a1e;
      --olive: #5c6e2b;
      --olive-light: #a8b96a;
      --olive-pale: #d4dba8;
      --olive-mist: #f5f7ec;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--olive-mist);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(92,110,43,0.1) 0%, transparent 50%),
        radial-gradient(circle at 85% 75%, rgba(168,185,106,0.12) 0%, transparent 45%);
      pointer-events: none;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(61,74,30,0.15);
      width: 100%;
      max-width: 420px;
      padding: 44px 40px;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .brand-mark {
      width: 52px; height: 52px;
      background: var(--olive-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.13);
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--olive-dark);
      margin-bottom: 8px;
    }
    .card-sub {
      color: #6b7a4a;
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* Google identity badge */
    .google-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f8f9fa;
      border: 1.5px solid #dadce0;
      border-radius: 50px;
      padding: 8px 20px;
      margin-bottom: 28px;
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
    }

    .btn-continue {
      display: block;
      width: 100%;
      background: var(--olive);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 12px;
    }
    .btn-continue:hover {
      background: var(--olive-dark);
      color: #fff;
      text-decoration: none;
    }
    .btn-cancel {
      display: block;
      width: 100%;
      background: transparent;
      color: #6b7a4a;
      border: 1.5px solid var(--olive-pale);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-cancel:hover {
      background: var(--olive-mist);
      color: var(--olive-dark);
      text-decoration: none;
      border-color: var(--olive-light);
    }
    .security-note {
      margin-top: 20px;
      font-size: 11px;
      color: #a8b96a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Brand -->
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <div class="card-title">Sign in with Google</div>
  <div class="card-sub">
    You are about to sign in to <strong style="color:var(--olive-dark);">Hangarin</strong><br>
    using your Google account.
  </div>

  <!-- Google badge -->
  <div>
    <span class="google-badge">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google Account
    </span>
  </div>

  <!-- Continue form (POST) -->
  <form method="post" action="">
    {% csrf_token %}
    {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
    {% endif %}
    <button type="submit" class="btn-continue">
      Continue with Google
    </button>
  </form>

  <a href="{% url 'account_login' %}" class="btn-cancel">Back to Login</a>

  <div class="security-note">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Secured by Google OAuth 2.0
  </div>

</div>
</body>
</html>
